name: Bug report
description: The specification or validator is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post real conversations, customer data, or any "anonymized sample".**
        If you need an example, use synthetic data you wrote yourself.
  - type: input
    id: version
    attributes:
      label: Specification version
      description: See the VERSION file, for example 1.0.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (synthetic data)
      description: A synthetic example that validate.mjs can check, or the commands and output
    validations:
      required: true
